<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DentalCare - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ================= PANTALLA: LOGIN ================= -->
  <main id="login-screen" class="screen-view login-screen">
    <div class="login-wrapper">
      <div class="login-device-frame">
        <!-- Header azul curvado -->
        <div class="login-header">
          <div class="status-bar">
            <span>4:41</span>
            <div class="status-icons">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="white">
                <rect x="0" y="8" width="3" height="4" rx="0.5"/>
                <rect x="4" y="5" width="3" height="7" rx="0.5"/>
                <rect x="8" y="2" width="3" height="10" rx="0.5"/>
                <rect x="12" y="0" width="3" height="12" rx="0.5"/>
              </svg>
              <div class="battery-icon">
                <div class="battery-level"></div>
              </div>
            </div>
          </div>

          <div class="logo-container">
            <div class="tooth-badge">
              <svg viewBox="0 0 24 24" class="tooth-svg">
                <path d="M12 2C8.5 2 6 4.2 6 7.5C6 10 7.2 11.8 7.8 14C8.6 17 8.2 21 10.2 21.8C10.8 22 11.4 21.3 11.8 20.3C12.1 19.3 12 18 12 16.5C12 18 11.9 19.3 12.2 20.3C12.6 21.3 13.2 22 13.8 21.8C15.8 21 15.4 17 16.2 14C16.8 11.8 18 10 18 7.5C18 4.2 15.5 2 12 2Z" fill="#2d60e8" stroke="#1d4ed8" stroke-width="1.2" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1 class="brand-title">DentalCare</h1>
            <p class="brand-slogan">Tu salud dental, en un solo lugar</p>
          </div>
        </div>

        <!-- Contenido blanco del formulario -->
        <div class="login-body">
          <div class="login-welcome">
            <h2>Bienvenido de nuevo</h2>
            <p>Inicia sesión para continuar</p>
          </div>

          <div id="login-error-alert" class="login-error-alert hidden" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="login-error-text">Contraseña incorrecta. Inténtalo de nuevo.</span>
          </div>

          <form id="login-form" class="login-form" autocomplete="on" novalidate>
            <div class="form-group">
              <label for="login-email">Correo electrónico</label>
              <input 
                type="email" 
                id="login-email" 
                name="email"
                placeholder="correo@ejemplo.com" 
                value="admin@dentalcare.com"
                required
              >
            </div>

            <div class="form-group">
              <label for="login-password">Contraseña</label>
              <div class="password-input-wrapper">
                <input 
                  type="password" 
                  id="login-password" 
                  name="password"
                  placeholder="••••••••" 
                  value="123456"
                  required
                >
                <button type="button" id="btn-toggle-password" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña" title="Mostrar contraseña">
                  <!-- Icono Ojo (Mostrar) -->
                  <svg id="eye-icon-show" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <!-- Icono Ojo Tachado (Ocultar) -->
                  <svg id="eye-icon-hide" class="eye-svg hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" id="btn-login" class="btn-primary btn-block">
              Iniciar sesión
            </button>

            <div class="forgot-password">
              <a href="#" id="link-forgot">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="register-prompt">
              <span>¿No tienes una cuenta?</span>
              <a href="#" id="link-register">Regístrate</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
